<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LifeOS Bookmarks</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <main class="panel">
    <p class="kicker">LIFEOS BOOKMARKS</p>
    <p class="muted">Start an import from the LifeOS import page. You approve every send in a separate window.</p>
    <p id="status" role="status">Checking bookmarks access…</p>
    <div class="actions">
      <button id="revoke" type="button" hidden>Give back access</button>
      <button id="open" type="button" class="primary">Open LifeOS import</button>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
